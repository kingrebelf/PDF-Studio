name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: xvfb-run -a npm test

  package:
    name: Package (${{ matrix.label }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            script: package:win
            artifact: PDF-Studio-windows-x64
          - os: ubuntu-latest
            label: linux-x64
            script: package:linux
            artifact: PDF-Studio-linux-x64
          - os: macos-14
            label: macos-arm64
            script: package:mac
            artifact: PDF-Studio-macos-arm64
          - os: macos-15-intel
            label: macos-x64
            script: package:mac-intel
            artifact: PDF-Studio-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      # Archive on the target OS before uploading: artifact uploads otherwise
      # discard executable permissions and macOS framework symlinks.
      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Archive Unix build
        if: runner.os != 'Windows'
        shell: bash
        run: (cd release && zip -qry "../${{ matrix.artifact }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          generate_release_notes: true

